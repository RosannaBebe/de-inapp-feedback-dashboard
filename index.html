 iPad to the office.\"\n \n\"I still can't do it, ma'am. I've restarted and re-downloaded it, but it's still the same. I'm using wifi on my iPad. I've also tried using data on my phone, but it still doesn't work. I'm using\"","source_count":1},{"id":"recvs9h8Tqtdyn","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"没有欢迎环节 —— 孩子从未真正「认识」Dino\n打开应用时，没有「到达」的感觉。没有 Dino 的自我介绍，没有个性化问候，也没有被邀请进入的感觉。目前的体验更像是打开了一个别人正在进行中的东西。\n建议： 首次打开应用时，播放一段简短、活力十足的动画介绍 —— 「嗨，我是 Dino，你来啦，我好开心！」—— 之后是欢迎礼物，再接一段简短的首页引导教学。","source_count":1},{"id":"recvs9hmPz2ObQ","priority":"P0","status":"进入需求池","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉、潘小英","description":"内容难度与所选等级不匹配\n选择的是 Level 1 —— 3至5岁、英语基础极少 —— 但课堂上却要求孩子说出从未教过的内容，包括在第1课一开始就要求说出 \"yes\" 和 \"no\"。动画中包含大量附带性语言，而重复次数远远不够。\n建议： 采用梅耶（Mayer）多媒体学习认知理论作为工作框架。其原则同样适用于 AI 驱动的媒体学习：去除多余语言、将内容切分成小单元、音频与画面相互对应、在不同情境中重复目标语言。\n具体做法： 在动画制作开始之前，审阅每一份脚本，删掉所有非必要的词。","source_count":1},{"id":"recvs9hyrhFPao","priority":"P1","status":"进入需求池","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"毕燕晨 Rosa","description":"麦克风「教学」并不是教学\n目前 Dino 说的是「麦克风开启 —— 看到声波的时候就说话」。这是在「讲」，而不是在「演示」。声波需要被视觉化地演示出来并配上动画。这个页面应该只负责权限，真正的教学应该放在别处，配合动画和一次练习尝试。","source_count":1},{"id":"recvs9hGIRTpai","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"增加引导式教学\n在 Dino 介绍和欢迎礼物之后，孩子应该得到一段简短的首页导览，让他们知道东西都在哪里、第一步该做什么。","source_count":1},{"id":"recvs9mgSsbo2S","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"显示「还没做过」的内容\n孩子尚未完成的内容应该在视觉上被区分出来 —— 更粗的描边、不同的颜色，或者轻微的发光 —— 以吸引注意并鼓励完成。","source_count":1},{"id":"recvs9mly8RtJ7","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"未填","description":"探索板块 —— 图片太小\n在「房间名称」游戏中，图片小到看不清楚。页面上有大量留白，把图片做大。","source_count":1},{"id":"recvs9mChPZWC0","priority":"P0","status":"进入需求池","category":"课后业务闭环","secondary":"未填","owner":"孔丽莉","description":"题目应该基于教过的内容\n游戏题目看起来和课程内容脱节。建议： 建立一个题库，题目内容全部来自孩子实际接触过的语言，题型也要和他们学过的形式匹配。","source_count":1},{"id":"recvs9mQ2ycuTk","priority":"P2","status":"Prompt-修复中","category":"内容课程 Content","secondary":"逐字稿错误/不恰当","owner":"孔丽莉、申璐迪","description":"「Say it with me」是错误的指令\n老师说「Say it with me ___（和我一起说）」，然后却等着孩子自己说。孩子是在跟读，不是在同时说。正确的说法应该是：「Repeat after me ___」、「You say ___」，或者干脆就是「Say ___」。","source_count":1},{"id":"recvs9n3Khu4mq","priority":"P0","status":"已解决","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉","description":"附带性语言过多\nLevel 1 的课程包含的语言量远超初学者的处理能力 —— 接近 Level 2 的难度。「apple」的重复很好，但「juice」和「bread」的重复少得多。用极少的语言做出有吸引力的内容确实非常难，这也正是大量早教内容失败的原因。\n需要的纪律是： 在动画制作开始之前，审阅每一份脚本，删掉所有非必要的语言。","source_count":1},{"id":"recvs9ndSYUYUT","priority":"P0","status":"已排期","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉、申璐迪","description":"自然拼读 —— 请明确意图\n课程中问「What does A say?（A 发什么音？）」，并要求孩子点击书面单词。这暗示了自然拼读和阅读教学，但目标学习者并不识字。请明确在这个等级上「阅读」是否是学习目标，并让互动方式与之对应。","source_count":1},{"id":"recvs9nnkg10jK","priority":"P1","status":"处理中","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"游戏指令不清晰\n「Let's tap and listen（我们来点一点、听一听）」并没有说明点什么、为什么点。建议：图片一开始是灰度的，孩子触摸后逐渐填充颜色，同时配上上行的音阶提示音。这样目标在视觉上一目了然，互动也更有满足感。","source_count":1},{"id":"recvs9nuI0Qzr3","priority":"P1","status":"进入需求池","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"赵琬雪、孔丽莉","description":"图片无法代表词义\n在泡泡游戏中，「Come on」对应的图片无法辨认 —— 如果连成年母语者都判断不出答案，孩子就更不可能了。同样，「bread」的图片里有一只在哭的水獭，把注意力从目标词上引开了。单词配图应该单独呈现目标概念，而不是把它藏在一个分散注意力的场景里。","source_count":1},{"id":"recvs9nBRWpHbt","priority":"P1","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"麦克风描边过于微弱\n麦克风按钮在等待说话时有一圈逐渐扩大的描边 —— 这是个好设计 —— 但太细了，注意不到。应该做得明显更粗、更醒目。","source_count":1},{"id":"recvs9o8RlDx87","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"分区标签需要重新思考\n目前的标签 —— 「Anytime Audio（随时听）」、「Good Night Time（晚安时间）」、「Morning Read（晨读）」—— 含义不清，而且没必要地把内容和一天中的时间段绑定在一起。\n建议改为按内容类型而非时间来划分： Story Time（故事时间）、Song Box（歌曲盒）、Bedtime Stories（睡前故事）、Quiet Listening（安静聆听）。这些对孩子来说更清楚，更容易用图标表现，也不会限制内容的使用时机。","source_count":1},{"id":"recvs9p6aG6NDi","priority":"P1","status":"进入需求池","category":"语音交互能力 Speech","secondary":"TTS音频异常","owner":"毕燕晨 Rosa、张帝","description":"老师的音频质量\n老师的表达中有拖长的声音 —— 「onnnn, come oonnnnn」—— 大概本意是鼓励，但效果不清晰，听起来还有点像在痛苦呻吟。值得重新审视。","source_count":1},{"id":"recvs9pAUzjoFL","priority":"P0","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"应用需要「阅读」，但学习者并不识字\n这是最严重的一个问题。几乎所有的导航和指令都依赖阅读英文。3–5岁的初学者不识字，因此无法独立使用这款应用。即使在有语音指令的地方，语言也过于自然、冗长，对真正的初学者来说信息量过大。\n建议： 所有指令都应该做到「不需要阅读也能理解」—— 通过语音、动画和视觉提示来传达。当孩子在一定时间内（建议以30秒为起点）没有任何操作时，应出现一个「手指指引」动画，明确告诉孩子该点哪里。","source_count":1},{"id":"recvs9pNpecZKp","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa、董鹏","description":"触摸反馈必须即时\n语音处理需要计算时间，这可以理解。但触摸交互不需要。目前点击一个泡泡或打开一个礼物，大约需要一秒才有反应。这个延迟同时降低了参与度和产品的品质感。\n建议： 检查每一处触摸交互，通过代码优化和资源预加载实现即时响应。孩子碰到什么，反应就应该是瞬间的。","source_count":1},{"id":"recvs9qqEuflvl","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"「明天见」是错误的信息\n领到开场金币之后，应用说了「明天见」。这是在结束这次使用，而不是在鼓励继续探索。应替换成建立连续打卡习惯的说法，例如「每天回来，礼物会越来越大哦！」，并配合实现连续登录的递增奖励机制。","source_count":1},{"id":"recvs9qMuHbTVo","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"按钮层级与优先级不匹配\n「Chat with Dino（和 Dino 聊天）」目前是最大、最居中、颜色最强烈的按钮 —— 但它不太可能是优先级最高的操作。与此同时，右下角的导航栏看起来包含了最重要的目的地，用的却是最小的按钮。\n建议： 先明确决定你希望孩子走哪条路径，然后让按钮的大小和颜色去反映这个层级。","source_count":1},{"id":"recvsb6Nb8XY5Z","priority":"P0","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa","description":"麦克风从未被教过 —— 而且行为不一致\n没有孩子能在没有教学的情况下学会使用麦克风。目前唯一的说明出现在一个静态页面上，而这个页面同时还在处理摄像头和麦克风权限，把两件完全不同的事情混在了一起。更严重的是，交互方式在不同板块之间还会变化 —— 有的地方是「点一下开始、再点一下结束」，有的地方是「按住说话」。\n建议： 把权限页面和麦克风教学分开。制作一段简短的动画演示，随后安排一次练习机会，并记录完成状态，避免重复出现。整个应用的麦克风交互方式必须统一为一种。","source_count":1},{"id":"recvsbbQcTeewp","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"没有明确的每日目标\n首页没有告诉孩子「今天该做什么」。\n建议： 设定三个清晰的每日任务 —— 例如：(1) 向 Dino 提一个问题；(2) 完成一节课；(3) 尝试一件新事情，比如玩一个游戏或用金币买东西。\n这三个任务应该通过尺寸、颜色或发光效果在视觉上占据主导地位，全部完成后应触发奖励。孩子对明确的任务和「完成」带来的满足感反应非常强烈。这同时也是引导他们去尝试不同板块的方式。","source_count":1},{"id":"recvsbcc8g9zcx","priority":"P0","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"设置流程要求家长具备英语阅读能力\n能力等级的选择完全是英文文字，这意味着只有英语很好的家长才能完成设置。 建议： 增加翻译选项，让新手引导流程可以用各个市场的本地语言呈现。","source_count":1},{"id":"recvsbdJW1mryQ","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"简化开场文案\n用户看到的第一段文字 —— 「只需回答几个简单问题……起点……」—— 比实际需要的复杂得多。每一个词都应该用同一个标准来检验：这个词是必要的吗？如果不是，就删掉。","source_count":1},{"id":"recvsbe04CBhZX","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"欢迎礼物 —— 缺少庆祝感\n领取金币时需要一个强烈的庆祝音效。此外，金币目前不会飞向右上角的金币计数器，也没有任何配套动画。这个时刻目前被处理得太平淡了。","source_count":1},{"id":"recvsbe681hHTL","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"立刻让金币产生意义\n孩子目前还没有理由想要金币。在欢迎礼物之后不久，应该引导他们去看 Dino 服装，让他们知道金币能解锁什么。那些服装投入了大量工作 —— 应该尽早展示出来。或者至少让 Dino 说一句：「用这些金币可以买更多衣服哦。」","source_count":1},{"id":"recvsbemmGTakq","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"令人困惑的回归提示\n返回首页时，弹出了一个窗口写着「你就快完成了，从上次的地方继续吧」。这个提示目的不明确，而且低水平的学习者根本读不懂。","source_count":1},{"id":"recvsbgREGFt5o","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"把头像变成进度中心\n左上角孩子的头像代表着「属于他们自己的东西」。这是放置进度追踪、每日任务和奖励的理想位置 —— 例如显示三项每日任务，以及全部完成后的额外奖励。","source_count":1},{"id":"recvsbh5uUUotK","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"特别课程需要「未来预告」\n完成第一节特别课程之后，没有任何迹象表明还会有更多。一个简单的「敬请期待」占位内容就能维持期待感，鼓励孩子再次回来。","source_count":1},{"id":"recvsbhOadQTcD","priority":"P0","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"优化点","owner":"赵琬雪","description":"答错后要显示正确答案\n答错题目时，正确答案没有被揭示出来。这浪费了一个学习机会 —— 孩子应该永远都能看到正确答案是什么。","source_count":1},{"id":"recvsbhXjVCeqb","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"李双","description":"游戏中麦克风行为不一致\n有一个游戏使用了与应用其他部分不同的麦克风交互方式。这必须统一。","source_count":1},{"id":"recvsbiuBKtr9b","priority":"P2","status":"挂起","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"探索板块 —— 缺少完成音效\n完成一个游戏时，老师看起来很兴奋，但没有配套的掌声音效。这个时刻显得很平淡。完成永远都应该有听得见的庆祝。","source_count":1},{"id":"recvsbiIfwa8dT","priority":"P2","status":"Prompt-修复中","category":"AI教师回应质量 Agent","secondary":"Prompt/逐字稿执行偏差","owner":"申璐迪","description":"不自然或含义不清的表达\n有几句话读起来不像自然的英语，或者目的不明确：「You and me together, yes or no?」和「Back on the trail.」。另外，「Say it super big」应该改成「Say it loudly」。所有脚本都应该由编辑审阅，确保语言自然且符合年龄。","source_count":1},{"id":"recvsbiPC575N8","priority":"P0","status":"已解决","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"赵琬雪","description":"金币遮住了下一个问题\n在 Final Cup 游戏中，答对后的金币及其动画盖住了下一道题，而且老师的下一句提示被奖励音效盖过，听不清楚。奖励反馈绝不能妨碍教学指令。 这个问题就出现在最开始，他问「What's your name?」的时候。","source_count":1},{"id":"recvsbiWAaKfZD","priority":"P2","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa、张帝","description":"缺失的音效\n有几个重要时刻完全没有声音：泡泡游戏没有「啵」的爆裂声、蛋是无声打开的、老师课程结束时的鼓掌也是静音的。每一个表扬或成就时刻都需要声音强化。","source_count":1},{"id":"recvsbjjpGRlQD","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"「完成」需要更有分量\n课程结束时的「done」标识又小又低调。对孩子来说，完成一节课是实实在在的成就，就应该有成就的感觉 —— 值得一场更充分的庆祝。","source_count":1},{"id":"recvsbjRJJPBhn","priority":"P1","status":"排查中","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"孔丽莉","description":"请审查被示范的行为\n有些动画示范了不应该鼓励幼儿模仿的动作 —— 打开烤箱，以及对着吸管吹气（音效是「吹」而不是「吸」）。请全面审查所有动画，找出可能被不当模仿的行为。","source_count":1},{"id":"recvsbjXD1VwrC","priority":"P1","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"李双","description":"游戏打开时没有语音引导\n进入 Dino Games 需要靠阅读才能知道该做什么。每一个板块打开时，都应该由 Dino 用简单的口语解释这是什么、怎么玩。","source_count":1},{"id":"recvsbkf7GfuSy","priority":"P0","status":"处理中","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"孔丽莉","description":"题目缺少音频支持\n有几道游戏题目只有文字，既没有音频选项也没有图片。而后面一些题目又有音频按钮和图片 —— 这种不一致需要解决。在 Level 1，每一道题都必须有音频。","source_count":1},{"id":"recvsbkkDux00I","priority":"P0","status":"已解决","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉","description":"题目难度远超 Level 1\n题目中出现了「grammatically（语法上）」这样的词 —— 对3–5岁的初学者来说远远超纲。还有一道题问「哪一个和图片匹配？」，但页面上根本没有图片。题目难度必须由所选等级来控制。","source_count":1},{"id":"recvsblaHGOfTC","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"把课程和听力馆连接起来\n课程中出现的歌曲和故事，应该在听力馆中被解锁。完成一节课应该看得见地为孩子的收藏增加一样东西 —— 这会带来令人愉悦的积累感，也让听力馆真正有了存在的意义。","source_count":1},{"id":"recvsblpi4u0Hq","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"未填","description":"给服装动画加上声音\n服装动画很吸引人，但是无声的。加上简单的配套音效 —— 比如踢足球的声音 —— 会让它们的满足感大大提升。","source_count":1},{"id":"recvsblDuOvpGG","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"未填","description":"购买前不要展示动画\n目前未购买的服装动画是完全可见的。这消除了购买的动力。建议： 购买前只显示静态图片，把动画留作购买后的奖励。另外也需要明确：除了外观之外，一套服装还有什么作用？是否有功能上的好处？","source_count":1},{"id":"recvsblKVqm5sX","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa","description":"课堂中的字号整体偏小。口语脚本还压在视频画面的白色边线上，导致很难阅读。","source_count":1},{"id":"recvsblRBJyZbw","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"图标在不同板块之间会变化 —— 特别课程里的收听图标和其他地方不一样。所有功能性图标在整个应用中必须保持一致。\n我不知道这个游戏该怎么玩？它没有图片。我认为这部分应该还没做完。","source_count":1},{"id":"recvsbmRQE4Pz3","priority":"P1", n":"学习计划价值宣传页： 1、标题上一个🌟遮挡住了文字 2、下面Level和unit展示板块目前UI看起来交互感强，用户看着想点选，但其实不可交互","source_count":1},{"id":"O029","priority":"P2","status":"已排期","category":"用户账户与家庭体系","secondary":"头像与主题个性化","owner":"李双","description":"【整合问题】\nProfile支持上传用户本地图片作为头像，并提供男孩/女孩、不同年龄形象、更多头像及主题个性化选项。\n\n【原始反馈】\n- [recvobjMztfS25] profile希望可以支持上传用户自己的本地图片作为头像。或者可以至少现有一个女孩的形象可供选择\n- [recvsfCoKSHZkM] 提供更多头像和主题个性化选项\n- [rec27JD4RZqXgZ] 建议用户的头像是可点击更改的\n- 男/女\n- 不同样子年纪（4岁和12岁样貌不一样），甚至可以给与多款选择增强体验感\n- [rec27PvMaVKKKV] I think the app need to have the gender: male, female so that the avatar will be show a girl or a boy and they able to upload their picture at well\n- [recvsfCoKS7SVB] 学生头像选择少，而且只显示男孩","source_count":1},{"id":"O030","priority":"P0","status":"已解决","category":"增长与转化","secondary":"注册激活与学习导流","owner":"李双","description":"上课提示或指引不够明显，很多用户初次打开并不知道要去上体验课，而是在跟Dino不断对话。","source_count":1},{"id":"O031","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"角色命名与性别适配","owner":"李双、毕燕晨 Rosa","description":"【整合问题】\n女性角色或女性AI老师使用“Max”等偏男性化名字，角色性别与命名不一致。\n\n【原始反馈】\n- [rec27JCQNnjwvb] 为什么女生的角色是男生的名字？\n- [recvsfCoKS6VdD] 女性老师使用“Max”这一偏男性化名字，角色设定不一致","source_count":1},{"id":"O032","priority":"P2","status":"已解决","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"Android 点击 back按钮直接出退APP，建议弹出确认，或者关闭back按钮功能。","source_count":1},{"id":"O033","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李淑怡、毕燕晨 Rosa","description":"【整合问题】\nASR语音识别不够稳定或灵敏，可能需要重复多次；已出现将“weekend”错误识别为“we can”的案例。\n\n【原始反馈】\n- [rec27JCWF00jl3] The interface seems smooth and looks very nice.\nThe lessons are interactive and engaging.\nSometimes happened where the voice recognition didn't capture the words, need to repeat few times. But not often\nI share screen shot where I said \"weekend\" but it capture \"we can\"\n- [recvpU0ThbzVBB] ASR识别不够灵敏：把weekend识别成we can","source_count":1},{"id":"O034","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双、李淑怡、毕燕晨 Rosa","description":"【整合问题】\n点击AI老师或Dino时缺少多样化互动反馈；应增加招手、舞蹈、趣味回复等主动或点击反应，提升角色活跃度。\n\n【原始反馈】\n- [rec27JD9rbnOPz] 当用户随手点击左边的卡通老师时，老师可有几个简单的互动和回复，比如\n- 招手说 hi, are you ready to learn?\n- 调皮被戳到的反应笑着说一些简单的回复（轻松有趣的回复）\n\n整体是为了增强体验感，当用户随手点击并得到反馈时，用户会更有兴趣探索。尽可能可以点击的地方都有得到简单的反馈会更棒\n- [rec27JDcmjULJW] 当用户点击Dino时，Dino可有不同的反应回馈，增强乐趣和互动。即使用户没有点击Dino，Dino也可以时不时有个小反应（招手，小舞蹈，可爱小动作）让Dino更活跃，而不是像个robot等待用户说话才给反应。","source_count":1},{"id":"O035","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李淑怡","description":"Sometimes, translations from one language to another are not accurate.","source_count":1},{"id":"O036","priority":"P0","status":"挂起","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李淑怡","description":"The app doesn't support Android from lowest version. The AI couldn't capture voice recognition frequently.","source_count":1},{"id":"O037","priority":"P0","status":"挂起","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"未填","description":"The content is not clear","source_count":1},{"id":"O038","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"未填","description":"The AI provides positive feedback such as \"Good job\" even when the student's answer is incorrect.","source_count":1},{"id":"O039","priority":"P0++","status":"已解决","category":"支付与订阅商业化","secondary":"支付订单与售后","owner":"未填","description":"Unable to make payment through google play store","source_count":1},{"id":"O040","priority":"P0++","status":"已解决","category":"支付与订阅商业化","secondary":"支付订单与售后","owner":"未填","description":"Customer facing issue when trying to login with OTP for payment page. Need several attempt to get the correct code. \nCode via WhatsApp was wrong. \nCode via SMS is correct.","source_count":1},{"id":"O041","priority":"P0","status":"已解决","category":"增长与转化","secondary":"注册激活与学习导流","owner":"未填","description":"\"when i click the google icon. It hang here\"\n The customer has done it multiple times but keeps hanging. Device is Android.","source_count":1},{"id":"O042","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"未填","description":"探索板块 —— 图片太小\n在「房间名称」游戏中，图片小到看不清楚。页面上有大量留白，把图片做大。","source_count":1},{"id":"O043","priority":"P0","status":"进入需求池","category":"课后业务闭环","secondary":"未填","owner":"孔丽莉","description":"题目应该基于教过的内容\n游戏题目看起来和课程内容脱节。建议： 建立一个题库，题目内容全部来自孩子实际接触过的语言，题型也要和他们学过的形式匹配。","source_count":1},{"id":"O044","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"分区标签需要重新思考\n目前的标签 —— 「Anytime Audio（随时听）」、「Good Night Time（晚安时间）」、「Morning Read（晨读）」—— 含义不清，而且没必要地把内容和一天中的时间段绑定在一起。\n建议改为按内容类型而非时间来划分： Story Time（故事时间）、Song Box（歌曲盒）、Bedtime Stories（睡前故事）、Quiet Listening（安静聆听）。这些对孩子来说更清楚，更容易用图标表现，也不会限制内容的使用时机。","source_count":1},{"id":"O045","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"按钮层级与优先级不匹配\n「Chat with Dino（和 Dino 聊天）」目前是最大、最居中、颜色最强烈的按钮 —— 但它不太可能是优先级最高的操作。与此同时，右下角的导航栏看起来包含了最重要的目的地，用的却是最小的按钮。\n建议： 先明确决定你希望孩子走哪条路径，然后让按钮的大小和颜色去反映这个层级。","source_count":1},{"id":"O046","priority":"P2","status":"挂起","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"探索板块 —— 缺少完成音效\n完成一个游戏时，老师看起来很兴奋，但没有配套的掌声音效。这个时刻显得很平淡。完成永远都应该有听得见的庆祝。","source_count":1},{"id":"O047","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"把课程和听力馆连接起来\n课程中出现的歌曲和故事，应该在听力馆中被解锁。完成一节课应该看得见地为孩子的收藏增加一样东西 —— 这会带来令人愉悦的积累感，也让听力馆真正有了存在的意义。","source_count":1},{"id":"O048","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"未填","description":"给服装动画加上声音\n服装动画很吸引人，但是无声的。加上简单的配套音效 —— 比如踢足球的声音 —— 会让它们的满足感大大提升。","source_count":1},{"id":"O049","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"未填","description":"购买前不要展示动画\n目前未购买的服装动画是完全可见的。这消除了购买的动力。建议： 购买前只显示静态图片，把动画留作购买后的奖励。另外也需要明确：除了外观之外，一套服装还有什么作用？是否有功能上的好处？","source_count":1},{"id":"O050","priority":"P2","status":"排查中","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李双","description":"姓名识别困难，甚至超过5分钟","source_count":1},{"id":"O051","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Listening Games部分音频不清晰","source_count":1},{"id":"O052","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Word Battle出现题目重复","source_count":1},{"id":"O053","priority":"P0","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"需要听音频的题目没有播放声音","source_count":1},{"id":"O054","priority":"P0","status":"排查中","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"Speaking进行到第三阶段后卡住，最终显示0分","source_count":1},{"id":"O055","priority":"P0","status":"排查中","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"图片或视频加载较慢","source_count":1},{"id":"O056","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李双","description":"盲盒答错后无法查看错题、正确答案和解释","source_count":1},{"id":"O057","priority":"P1","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"【整合问题】\n试用期间每个功能只能体验一次，且不能重复练习，导致用户无法充分体验产品能力。\n\n【原始反馈】\n- [recvsfCnEX2m4V] 每个功能只能体验一次\n- [recvsfCnEXoAo7] 试用期间不能重复练习","source_count":1},{"id":"O058","priority":"P1","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"试用期间不能尝试不同课程或等级","source_count":1},{"id":"O059","priority":"P0","status":"排查中","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"体验出现故障后，没有第二次验证机会","source_count":1},{"id":"O060","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"在当前试用限制下，价格会显得偏高","source_count":1},{"id":"O061","priority":"P0","status":"排查中","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"【整合问题】\n学习计划显示“每周三节课”，用户无法判断这是推荐学习频率还是订阅后的使用上限。\n\n【原始反馈】\n- [recvsfCnEXJwwH] 学习计划显示“每周三节课”，用户无法判断订阅后是否每周只能上三节课\n- [recvsfCnEXBhcr] 用户无法判断“三节课”是推荐学习频率还是使用上限","source_count":1},{"id":"O062","priority":"P0","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"【整合问题】\n用户无法判断不同订阅套餐包含的权益、可用内容量，以及AI对话、游戏和练习是否可以无限使用。\n\n【原始反馈】\n- [recvsfCoKSkpIW] 用户无法判断AI对话、游戏和练习是否可以无限使用\n- [recvsfCoKSrzME] 用户无法判断不同订阅套餐分别包含什么权益\n- [recvsfCoKSadHT] 用户不知道支付后究竟能获得多少内容","source_count":1},{"id":"O063","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"文化宗教与市场偏好","owner":"李双","description":"建议增加戴Hijab、穿沙特服装的女性老师","source_count":1},{"id":"O064","priority":"P2","status":"挂起","category":"用户账户与家庭体系","secondary":"家庭与学生档案","owner":"李双","description":"填写姓名和年龄时增加性别选择，并匹配相应头像","source_count":1},{"id":"O065","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李双","description":"首次进入时没有语音欢迎\n第一次进入这个板块时，Dino 的开场白只以文字形式显示，没有音频，需要另外点一个按钮才能听到。这可能是个 bug。第二次进入时它立刻开口说话了，体验好得多。每一个新板块都应该以语音欢迎开场 —— 最好能叫出孩子的名字。","source_count":1},{"id":"O066","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"对小龄学习者来说过于开放\n聊天完全没有结构。出现了一个关于「聊聊太空」的提示，但一个低龄初学者根本不知道该怎么参与。应用在新手引导时已经收集了孩子的等级 —— 这个等级应该用来决定这个板块的内容。年龄小的孩子需要建议和支架式引导；年龄大的孩子需要适当的挑战。","source_count":1},{"id":"O067","priority":"P1","status":"挂起","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"Dino Chat 需要一个目标\n其他板块都有进度指示 —— 游戏区显示「0/5」，非常有效地传达了目标。Dino Chat 没有对应的东西。如果希望孩子使用这个板块，就要给它一个清晰、可见的目标，让孩子知道「做完」是什么样子。","source_count":1},{"id":"O068","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"建议 —— 看图说话\n鼓励低龄学习者开口的一个成熟方法是描述图片。Dino 可以展示一张图片 —— 或者更好，一段有趣的短视频 —— 然后请孩子说出他看到的东西。这创造了自然的、低压力的开口机会。","source_count":1},{"id":"O069","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"毕燕晨 Rosa","description":"Dino 的倾听姿势\n孩子说话时 Dino 把手放到耳边，这个细节非常棒。但他做这个动作时头部有一部分会消失 —— 值得修正。","source_count":1},{"id":"O070","priority":"P0","status":"排查中","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"目前只有 1 节免费的试听课，时长 12–18 分钟，如果孩子自己完成试听后就可以直接退出，用户的退出成本比较低，体验深度也比较有限，所以可能比较容易流失。可以考虑把免费体验增加到 3 节，让孩子和家长投入更多时间和精力，随着体验深度增加，用户的退出成本也会提高，形成一定的投入感和持续学习意愿，从而可能提升后续的转化率和留存。","source_count":1},{"id":"O071","priority":"P0","status":"待分析","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"未填","description":"第一次进入 App 时，整体操作流程比较复杂，而且前期引导全部是英文，家长和孩子不太容易理解每一步该怎么操作，也不太清楚如何正确选择","source_count":1}],"课中（未去重）":[{"id":"recvmMSjHgSfXi","priority":"P0","status":"已解决","category":"课堂流程 / 交互链路 Flow","secondary":"跳环节","owner":"赵琬雪","description":"Song time 再次出现并这次播放成功，需判断是否网络导致前一次未触发","source_count":1},{"id":"recvmMSkn1DJvO","priority":"P0","status":"已解决","category":"AI教师回应质量 Agent","secondary":"回复不合理","owner":"申璐迪","description":"学生答对Yes后老师先给Take your time，话术与情境错位","source_count":1},{"id":"recvmMSkxr8yub","priority":"P0","status":"已解决","category":"课堂流程 / 交互链路 Flow","secondary":"等待过长","owner":"毕燕晨 Rosa","description":"1、学生正确回答后老师无即时响应，疑似识别或网络延迟\n2、学生快速完成输出后老师无即时反应，延迟明显\n3、学生完整输出后等待较久才反馈；反馈方式本身较好","source_count":1},{"id":"recvmMSl5mIPic","priority":"P1","status":"已解决","category":"语音交互能力 Speech","secondary":"TTS未播放/未返回","owner":"张帝","description":"老师嘴动无声音，疑似音频丢失或网络卡顿","source_count":1},{"id":"recvmMSGwJNwDy","priority":"P0","status":"已解决","category":"AI教师回应质量 Agent","secondary":"回复不合理","owner":"申璐迪","description":"学生回答明显不是正确答案，老师先判Right，后又I don’t know，逻辑冲突","source_count":1},{"id":"recvmMSHjn5mE4","priority":"P0","status":"已解决","category":"AI教师回应质量 Agent","secondary":"回复不合理","owner":"申璐迪","description":"学生正确且拓展输出后被 No worries 回应，疑似标答匹配过严","source_count":1},{"id":"recvmMSHmMCAke","priority":"P0","status":"已解决","category":"AI教师回应质量 Agent","secondary":"回复不合理","owner":"申璐迪","description":"学生说核心词 horse 已正确，但因缺 the 疑似被弱判；前后情绪反应割裂","source_count":1},{"id":"recvmMSHsaKM7Z","priority":"P1","status":"已解决","category":"AI教师回应质量 Agent","secondary":"兜底回复异常","owner":"申璐迪","descriptio ption":"问题太多了：老师动作、表情、口型","source_count":1},{"id":"recvrT40D69qx8","priority":"P0++","status":"已解决","category":"语音交互能力 Speech","secondary":"TTS未播放/未返回","owner":"毕燕晨 Rosa","description":"horse 这里卡住了，问题 2 p1 老师二次提示除了动作，需要声音 3","source_count":1},{"id":"recvrT40D6qBn8","priority":"P0++","status":"已解决","category":"课堂流程 / 交互链路 Flow","secondary":"卡环节","owner":"毕燕晨 Rosa、张帝","description":"horse 这里卡住了，问题 3 p0 要加一个 fallback 机制：如果老师二次提示后 5s 内再没有听到学生响应，老师需要 主动推进课堂 语音评测问题- 张帝","source_count":1},{"id":"recvrTqh4sdl5L","priority":"P2","status":"已解决","category":"AI教师回应质量 Agent","secondary":"反馈话术不合适","owner":"孔丽莉、申璐迪","description":"1 Wait wait wait 看看有没有更好的文案可以表达这种终于揭晓答案的场景 P1 2 一样的问题 say it - it's a horse","source_count":1},{"id":"recvrTBvPogl1f","priority":"P0","status":"已解决","category":"课堂流程 / 交互链路 Flow","secondary":"时序混乱","owner":"毕燕晨 Rosa、张帝","description":"这里有一个Listening的TPR，倾听的动作，但因为网络比较差，TTS其实没有被播出 这里需要优化：这个倾听的动作TPR一定要在老师问问题后，才能够出现，如果老师问问题的TTS音频没有播放，不要展示这个倾听动作，会误导学生。 逐字稿： T: (drumroll) [student name]! <#0.3#> Boo lifts the big lid... 🥁 <#0.5#> It's a GIANT silly pile — apples, juice, all over the bread! 😂 <#0.3#> Did you like cooking with Chef Boo?(说完前面的话后，【老师动作：倾听】）","source_count":1},{"id":"recvrTJeZQdgm7","priority":"P0","status":"已解决","category":"内容课程 Content","secondary":"教学节奏/模板设计","owner":"孔丽莉","description":"level 1体验课-这道题目....同时从教学层面，在没有解释什么是letter name letter sound前（input），上来就说big a small a孩子根本不理解）（已更换template）","source_count":1},{"id":"recvrTMpRH3XCA","priority":"P0","status":"已解决","category":"UI/UX与练习体验 UX","secondary":"按钮/点击反馈异常","owner":"毕燕晨 Rosa","description":"课中跟读的练习，....而且用户多次点击后，Hold to Speak按钮就不灵敏了，建议跟首页Dino的Talk的收音交互一致（交互已改）","source_count":1},{"id":"recvrUxPmDcJgK","priority":"P1","status":"挂起","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"申璐迪","description":"......\n指令不清，容易不知道老师让读的内容是什么","source_count":1},{"id":"recvrUChTjTWtq","priority":"P1","status":"Prompt-修复中","category":"AI教师回应质量 Agent","secondary":"Prompt/逐字稿执行偏差","owner":"毕燕晨 Rosa","description":"TTS对于读取带符号和下划线的内容时读音和时间间隔很奇怪","source_count":1},{"id":"recvrV1Tr1kezm","priority":"P0","status":"已解决","category":"数字人表现 Avatar","secondary":"音画不同步","owner":"张帝","description":"音画不同步、动作延迟","source_count":1},{"id":"recvrV3zf9zMth","priority":"P0","status":"已解决","category":"AI教师回应质量 Agent","secondary":"未回应学生","owner":"孔丽莉","description":"学生字幕上墙了，老师未回复\n\n6780230001","source_count":1},{"id":"rec27XVBhlpslZ","priority":"P0++","status":"已解决","category":"课堂流程 / 交互链路 Flow","secondary":"进入课堂失败","owner":"董鹏","description":"App lags before entering the class. It complete stucks. \n\nActual feedback: \n\"Is it really a long time, madam? Ok, I'll do it this afternoon because I didn't bring my iPad to the office. Ok, I'll do it this afternoon because I didn't bring my iPad to the office.\"\n \n\"I still can't do it, ma'am. I've restarted and re-downloaded it, but it's still the same. I'm using wifi on my iPad. I've also tried using data on my phone, but it still doesn't work. I'm using\"","source_count":1},{"id":"recvs9h8Tqtdyn","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"没有欢迎环节 —— 孩子从未真正「认识」Dino\n打开应用时，没有「到达」的感觉。没有 Dino 的自我介绍，没有个性化问候，也没有被邀请进入的感觉。目前的体验更像是打开了一个别人正在进行中的东西。\n建议： 首次打开应用时，播放一段简短、活力十足的动画介绍 —— 「嗨，我是 Dino，你来啦，我好开心！」—— 之后是欢迎礼物，再接一段简短的首页引导教学。","source_count":1},{"id":"recvs9hmPz2ObQ","priority":"P0","status":"进入需求池","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉、潘小英","description":"内容难度与所选等级不匹配\n选择的是 Level 1 —— 3至5岁、英语基础极少 —— 但课堂上却要求孩子说出从未教过的内容，包括在第1课一开始就要求说出 \"yes\" 和 \"no\"。动画中包含大量附带性语言，而重复次数远远不够。\n建议： 采用梅耶（Mayer）多媒体学习认知理论作为工作框架。其原则同样适用于 AI 驱动的媒体学习：去除多余语言、将内容切分成小单元、音频与画面相互对应、在不同情境中重复目标语言。\n具体做法： 在动画制作开始之前，审阅每一份脚本，删掉所有非必要的词。","source_count":1},{"id":"recvs9hyrhFPao","priority":"P1","status":"进入需求池","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"毕燕晨 Rosa","description":"麦克风「教学」并不是教学\n目前 Dino 说的是「麦克风开启 —— 看到声波的时候就说话」。这是在「讲」，而不是在「演示」。声波需要被视觉化地演示出来并配上动画。这个页面应该只负责权限，真正的教学应该放在别处，配合动画和一次练习尝试。","source_count":1},{"id":"recvs9hGIRTpai","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"增加引导式教学\n在 Dino 介绍和欢迎礼物之后，孩子应该得到一段简短的首页导览，让他们知道东西都在哪里、第一步该做什么。","source_count":1},{"id":"recvs9mgSsbo2S","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"显示「还没做过」的内容\n孩子尚未完成的内容应该在视觉上被区分出来 —— 更粗的描边、不同的颜色，或者轻微的发光 —— 以吸引注意并鼓励完成。","source_count":1},{"id":"recvs9mQ2ycuTk","priority":"P2","status":"Prompt-修复中","category":"内容课程 Content","secondary":"逐字稿错误/不恰当","owner":"孔丽莉、申璐迪","description":"「Say it with me」是错误的指令\n老师说「Say it with me ___（和我一起说）」，然后却等着孩子自己说。孩子是在跟读，不是在同时说。正确的说法应该是：「Repeat after me ___」、「You say ___」，或者干脆就是「Say ___」。","source_count":1},{"id":"recvs9n3Khu4mq","priority":"P0","status":"已解决","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉","description":"附带性语言过多\nLevel 1 的课程包含的语言量远超初学者的处理能力 —— 接近 Level 2 的难度。「apple」的重复很好，但「juice」和「bread」的重复少得多。用极少的语言做出有吸引力的内容确实非常难，这也正是大量早教内容失败的原因。\n需要的纪律是： 在动画制作开始之前，审阅每一份脚本，删掉所有非必要的语言。","source_count":1},{"id":"recvs9ndSYUYUT","priority":"P0","status":"已排期","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉、申璐迪","description":"自然拼读 —— 请明确意图\n课程中问「What does A say?（A 发什么音？）」，并要求孩子点击书面单词。这暗示了自然拼读和阅读教学，但目标学习者并不识字。请明确在这个等级上「阅读」是否是学习目标，并让互动方式与之对应。","source_count":1},{"id":"recvs9nnkg10jK","priority":"P1","status":"处理中","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"游戏指令不清晰\n「Let's tap and listen（我们来点一点、听一听）」并没有说明点什么、为什么点。建议：图片一开始是灰度的，孩子触摸后逐渐填充颜色，同时配上上行的音阶提示音。这样目标在视觉上一目了然，互动也更有满足感。","source_count":1},{"id":"recvs9nuI0Qzr3","priority":"P1","status":"进入需求池","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"赵琬雪、孔丽莉","description":"图片无法代表词义\n在泡泡游戏中，「Come on」对应的图片无法辨认 —— 如果连成年母语者都判断不出答案，孩子就更不可能了。同样，「bread」的图片里有一只在哭的水獭，把注意力从目标词上引开了。单词配图应该单独呈现目标概念，而不是把它藏在一个分散注意力的场景里。","source_count":1},{"id":"recvs9nBRWpHbt","priority":"P1","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"麦克风描边过于微弱\n麦克风按钮在等待说话时有一圈逐渐扩大的描边 —— 这是个好设计 —— 但太细了，注意不到。应该做得明显更粗、更醒目。","source_count":1},{"id":"recvs9p6aG6NDi","priority":"P1","status":"进入需求池","category":"语音交互能力 Speech","secondary":"TTS音频异常","owner":"毕燕晨 Rosa、张帝","description":"老师的音频质量\n老师的表达中有拖长的声音 —— 「onnnn, come oonnnnn」—— 大概本意是鼓励，但效果不清晰，听起来还有点像在痛苦呻吟。值得重新审视。","source_count":1},{"id":"recvs9pAUzjoFL","priority":"P0","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"应用需要「阅读」，但学习者并不识字\n这是最严重的一个问题。几乎所有的导航和指令都依赖阅读英文。3–5岁的初学者不识字，因此无法独立使用这款应用。即使在有语音指令的地方，语言也过于自然、冗长，对真正的初学者来说信息量过大。\n建议： 所有指令都应该做到「不需要阅读也能理解」—— 通过语音、动画和视觉提示来传达。当孩子在一定时间内（建议以30秒为起点）没有任何操作时，应出现一个「手指指引」动画，明确告诉孩子该点哪里。","source_count":1},{"id":"recvs9pNpecZKp","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa、董鹏","description":"触摸反馈必须即时\n语音处理需要计算时间，这可以理解。但触摸交互不需要。目前点击一个泡泡或打开一个礼物，大约需要一秒才有反应。这个延迟同时降低了参与度和产品的品质感。\n建议： 检查每一处触摸交互，通过代码优化和资源预加载实现即时响应。孩子碰到什么，反应就应该是瞬间的。","source_count":1},{"id":"recvs9qqEuflvl","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"「明天见」是错误的信息\n领到开场金币之后，应用说了「明天见」。这是在结束这次使用，而不是在鼓励继续探索。应替换成建立连续打卡习惯的说法，例如「每天回来，礼物会越来越大哦！」，并配合实现连续登录的递增奖励机制。","source_count":1},{"id":"recvsb6Nb8XY5Z","priority":"P0","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa","description":"麦克风从未被教过 —— 而且行为不一致\n没有孩子能在没有教学的情况下学会使用麦克风。目前唯一的说明出现在一个静态页面上，而这个页面同时还在处理摄像头和麦克风权限，把两件完全不同的事情混在了一起。更严重的是，交互方式在不同板块之间还会变化 —— 有的地方是「点一下开始、再点一下结束」，有的地方是「按住说话」。\n建议： 把权限页面和麦克风教学分开。制作一段简短的动画演示，随后安排一次练习机会，并记录完成状态，避免重复出现。整个应用的麦克风交互方式必须统一为一种。","source_count":1},{"id":"recvsbbQcTeewp","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"没有明确的每日目标\n首页没有告诉孩子「今天该做什么」。\n建议： 设定三个清晰的每日任务 —— 例如：(1) 向 Dino 提一个问题；(2) 完成一节课；(3) 尝试一件新事情，比如玩一个游戏或用金币买东西。\n这三个任务应该通过尺寸、颜色或发光效果在视觉上占据主导地位，全部完成后应触发奖励。孩子对明确的任务和「完成」带来的满足感反应非常强烈。这同时也是引导他们去尝试不同板块的方式。","source_count":1},{"id":"recvsbcc8g9zcx","priority":"P0","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"设置流程要求家长具备英语阅读能力\n能力等级的选择完全是英文文字，这意味着只有英语很好的家长才能完成设置。 建议： 增加翻译选项，让新手引导流程可以用各个市场的本地语言呈现。","source_count":1},{"id":"recvsbdJW1mryQ","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"简化开场文案\n用户看到的第一段文字 —— 「只需回答几个简单问题……起点……」—— 比实际需要的复杂得多。每一个词都应该用同一个标准来检验：这个词是必要的吗？如果不是，就删掉。","source_count":1},{"id":"recvsbe04CBhZX","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"欢迎礼物 —— 缺少庆祝感\n领取金币时需要一个强烈的庆祝音效。此外，金币目前不会飞向右上角的金币计数器，也没有任何配套动画。这个时刻目前被处理得太平淡了。","source_count":1},{"id":"recvsbe681hHTL","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"立刻让金币产生意义\n孩子目前还没有理由想要金币。在欢迎礼物之后不久，应该引导他们去看 Dino 服装，让他们知道金币能解锁什么。那些服装投入了大量工作 —— 应该尽早展示出来。或者至少让 Dino 说一句：「用这些金币可以买更多衣服哦。」","source_count":1},{"id":"recvsbemmGTakq","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"令人困惑的回归提示\n返回首页时，弹出了一个窗口写着「你就快完成了，从上次的地方继续吧」。这个提示目的不明确，而且低水平的学习者根本读不懂。","source_count":1},{"id":"recvsbgREGFt5o","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"把头像变成进度中心\n左上角孩子的头像代表着「属于他们自己的东西」。这是放置进度追踪、每日任务和奖励的理想位置 —— 例如显示三项每日任务，以及全部完成后的额外奖励。","source_count":1},{"id":"recvsbh5uUUotK","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"新手引导不足","owner":"毕燕晨 Rosa","description":"特别课程需要「未来预告」\n完成第一节特别课程之后，没有任何迹象表明还会有更多。一个简单的「敬请期待」占位内容就能维持期待感，鼓励孩子再次回来。","source_count":1},{"id":"recvsbhOadQTcD","priority":"P0","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"优化点","owner":"赵琬雪","description":"答错后要显示正确答案\n答错题目时，正确答案没有被揭示出来。这浪费了一个学习机会 —— 孩子应该永远都能看到正确答案是什么。","source_count":1},{"id":"recvsbhXjVCeqb","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"李双","description":"游戏中麦克风行为不一致\n有一个游戏使用了与应用其他部分不同的麦克风交互方式。这必须统一。","source_count":1},{"id":"recvsbiIfwa8dT","priority":"P2","status":"Prompt-修复中","category":"AI教师回应质量 Agent","secondary":"Prompt/逐字稿执行偏差","owner":"申璐迪","description":"不自然或含义不清的表达\n有几句话读起来不像自然的英语，或者目的不明确：「You and me together, yes or no?」和「Back on the trail.」。另外，「Say it super big」应该改成「Say it loudly」。所有脚本都应该由编辑审阅，确保语言自然且符合年龄。","source_count":1},{"id":"recvsbiPC575N8","priority":"P0","status":"已解决","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"赵琬雪","description":"金币遮住了下一个问题\n在 Final Cup 游戏中，答对后的金币及其动画盖住了下一道题，而且老师的下一句提示被奖励音效盖过，听不清楚。奖励反馈绝不能妨碍教学指令。 这个问题就出现在最开始，他问「What's your name?」的时候。","source_count":1},{"id":"recvsbiWAaKfZD","priority":"P2","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa、张帝","description":"缺失的音效\n有几个重要时刻完全没有声音：泡泡游戏没有「啵」的爆裂声、蛋是无声打开的、老师课程结束时的鼓掌也是静音的。每一个表扬或成就时刻都需要声音强化。","source_count":1},{"id":"recvsbjjpGRlQD","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"「完成」需要更有分量\n课程结束时的「done」标识又小又低调。对孩子来说，完成一节课是实实在在的成就，就应该有成就的感觉 —— 值得一场更充分的庆祝。","source_count":1},{"id":"recvsbjRJJPBhn","priority":"P1","status":"排查中","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"孔丽莉","description":"请审查被示范的行为\n有些动画示范了不应该鼓励幼儿模仿的动作 —— 打开烤箱，以及对着吸管吹气（音效是「吹」而不是「吸」）。请全面审查所有动画，找出可能被不当模仿的行为。","source_count":1},{"id":"recvsbjXD1VwrC","priority":"P1","status":"已排期","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"李双","description":"游戏打开时没有语音引导\n进入 Dino Games 需要靠阅读才能知道该做什么。每一个板块打开时，都应该由 Dino 用简单的口语解释这是什么、怎么玩。","source_count":1},{"id":"recvsbkf7GfuSy","priority":"P0","status":"处理中","category":"内容课程 Content","secondary":"素材缺失/错误","owner":"孔丽莉","description":"题目缺少音频支持\n有几道游戏题目只有文字，既没有音频选项也没有图片。而后面一些题目又有音频按钮和图片 —— 这种不一致需要解决。在 Level 1，每一道题都必须有音频。","source_count":1},{"id":"recvsbkkDux00I","priority":"P0","status":"已解决","category":"内容课程 Content","secondary":"教学目标与活动不匹配","owner":"孔丽莉","description":"题目难度远超 Level 1\n题目中出现了「grammatically（语法上）」这样的词 —— 对3–5岁的初学者来说远远超纲。还有一道题问「哪一个和图片匹配？」，但页面上根本没有图片。题目难度必须由所选等级来控制。","source_count":1},{"id":"recvsblKVqm5sX","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa","description":"课堂中的字号整体偏小。口语脚本还压在视频画面的白色边线上，导致很难阅读。","source_count":1},{"id":"recvsblRBJyZbw","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"图标在不同板块之间会变化 —— 特别课程里的收听图标和其他地方不一样。所有功能性图标在整个应用中必须保持一致。\n我不知道这个游戏该怎么玩？它没有图片。我认为这部分应该还没做完。","source_count":1},{"id":"recvsbmRQE4Pz3","priority":"P1","status":"已解决","category":"UI/UX与练习体验 UX","secondary":"练习交互不顺畅","owner":"毕燕晨 Rosa","description":"课程画面中的图片相对于可用空间来说太小了。","source_count":1},{"id":"recvsbnanVsKNs","priority":"P2","status":"进入需求池","category":"数字人表现 Avatar","secondary":"动作/表情/互动不当与异常","owner":"毕燕晨 Rosa","description":"「答对」时的表情相当凶 —— 建议换成更温暖、更友善的反应，这样更适合这个年龄段。","source_count":1},{"id":"recvsbnAGT6iuJ","priority":"P1","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"页面状态反馈缺失","owner":"毕燕晨 Rosa","description":"当孩子在合理时间内没有选出正确答案时，正确选项应该主动吸引注意 —— 通过发光、颜色变化或轻微的动作。","source_count":1},{"id":"recvsbnN0qm2qH","priority":"P2","status":"进入需求池","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"毕燕晨 Rosa","description":"泡泡应该采用和礼物盒相同的「邀请式晃动」动画。静止的目标不会激发互动。","source_count":1},{"id":"recvsfClWjMQmO","priority":"P1","status":"排查中","category":"内容课程 Content","secondary":"逐字稿错误/不恰当","owner":"毕燕晨 Rosa","description":"课程说明提示“听题”，实际只有文字","source_count":1},{"id":"recvsfClWjLhRC","priority":"P1","status":"排查中","category":"UI/UX与练习体验 UX","secondary":"金币/奖励异常","owner":"毕燕晨 Rosa","description":"领取蛋奖励后，没有显示具体获得的奖励","source_count":1},{"id":"recvsfClWjxPUC","priority":"P1","status":"进入需求池","category":"语音交互能力 Speech","secondary":"TTS音频异常","owner":"毕燕晨 Rosa","description":"AI老师部分时间语速过快","so 怡","description":"【整合问题】\nDino在自由对话中会出现语法错误，并反复执着于某个话题或爱好（如oranges），影响对话自然度。\n\n【原始反馈】\n- [recvo0CXiv7kil] speaking里的dino对话问题调试，时常会有一些语法错误；以及dino一直很执着于说oranges\n- [recvpU0ykHKjiE] Dino在对话过程中会出现语法错误和执著于披露某个爱好的倾向","source_count":1},{"id":"recvo0CYMWJUdt","priority":"P0","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李淑怡","description":"【整合问题】\nDino在对话中存在多语言混说或语言使用不准确，例如英文回答中夹杂中文“九”，影响目标语言一致性。\n\n【原始反馈】\n- [recvo0CYMWJUdt] speaking里的dino存在中英混说的情况，例如问how old are you两次，dino都回复i‘m 9 (九）\n- [recvpU0OYVOrqp] 对话过程中Dino的多语言混说问题：speaking里的dino存在中英混说的情况，例如问how old are you两次，dino都回复i‘m 9 (九）\n- [recvpU1dZUahfI] 对话过程中的多语言使用不准确的问题","source_count":1},{"id":"recvo0DcKykECI","priority":"P1","status":"已排期","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"dino盲盒里面的题库建议集中梳理一次资源，例如题目的分级、有些不妥的题目删除等。目前测level2的时候题目难易度差距太大，有些题目过难（右侧国旗是否合规，已知国旗、地图等很容易不合规；帮妈妈做什么题每个选项感觉都对；图3明显对于l2太难了）","source_count":1},{"id":"recvo1e4xPc1WT","priority":"P2","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"学习计划价值宣传页： 1、标题上一个🌟遮挡住了文字 2、下面Level和unit展示板块目前UI看起来交互感强，用户看着想点选，但其实不可交互","source_count":1},{"id":"recvobjMztfS25","priority":"P2","status":"已排期","category":"用户账户与家庭体系","secondary":"头像与主题个性化","owner":"李双","description":"【整合问题】\nProfile支持上传用户本地图片作为头像，并提供男孩/女孩、不同年龄形象、更多头像及主题个性化选项。\n\n【原始反馈】\n- [recvobjMztfS25] profile希望可以支持上传用户自己的本地图片作为头像。或者可以至少现有一个女孩的形象可供选择\n- [recvsfCoKSHZkM] 提供更多头像和主题个性化选项\n- [rec27JD4RZqXgZ] 建议用户的头像是可点击更改的\n- 男/女\n- 不同样子年纪（4岁和12岁样貌不一样），甚至可以给与多款选择增强体验感\n- [rec27PvMaVKKKV] I think the app need to have the gender: male, female so that the avatar will be show a girl or a boy and they able to upload their picture at well\n- [recvsfCoKS7SVB] 学生头像选择少，而且只显示男孩","source_count":1},{"id":"rec27JCFurudG5","priority":"P0","status":"已解决","category":"增长与转化","secondary":"注册激活与学习导流","owner":"李双","description":"上课提示或指引不够明显，很多用户初次打开并不知道要去上体验课，而是在跟Dino不断对话。","source_count":1},{"id":"rec27JCQNnjwvb","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"角色命名与性别适配","owner":"李双、毕燕晨 Rosa","description":"【整合问题】\n女性角色或女性AI老师使用“Max”等偏男性化名字，角色性别与命名不一致。\n\n【原始反馈】\n- [rec27JCQNnjwvb] 为什么女生的角色是男生的名字？\n- [recvsfCoKS6VdD] 女性老师使用“Max”这一偏男性化名字，角色设定不一致","source_count":1},{"id":"rec27JCW378i27","priority":"P2","status":"已解决","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"Android 点击 back按钮直接出退APP，建议弹出确认，或者关闭back按钮功能。","source_count":1},{"id":"rec27JCWF00jl3","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李淑怡、毕燕晨 Rosa","description":"【整合问题】\nASR语音识别不够稳定或灵敏，可能需要重复多次；已出现将“weekend”错误识别为“we can”的案例。\n\n【原始反馈】\n- [rec27JCWF00jl3] The interface seems smooth and looks very nice.\nThe lessons are interactive and engaging.\nSometimes happened where the voice recognition didn't capture the words, need to repeat few times. But not often\nI share screen shot where I said \"weekend\" but it capture \"we can\"\n- [recvpU0ThbzVBB] ASR识别不够灵敏：把weekend识别成we can","source_count":1},{"id":"rec27JD9rbnOPz","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双、李淑怡、毕燕晨 Rosa","description":"【整合问题】\n点击AI老师或Dino时缺少多样化互动反馈；应增加招手、舞蹈、趣味回复等主动或点击反应，提升角色活跃度。\n\n【原始反馈】\n- [rec27JD9rbnOPz] 当用户随手点击左边的卡通老师时，老师可有几个简单的互动和回复，比如\n- 招手说 hi, are you ready to learn?\n- 调皮被戳到的反应笑着说一些简单的回复（轻松有趣的回复）\n\n整体是为了增强体验感，当用户随手点击并得到反馈时，用户会更有兴趣探索。尽可能可以点击的地方都有得到简单的反馈会更棒\n- [rec27JDcmjULJW] 当用户点击Dino时，Dino可有不同的反应回馈，增强乐趣和互动。即使用户没有点击Dino，Dino也可以时不时有个小反应（招手，小舞蹈，可爱小动作）让Dino更活跃，而不是像个robot等待用户说话才给反应。","source_count":1},{"id":"rec27JEzEFeBzd","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李淑怡","description":"Sometimes, translations from one language to another are not accurate.","source_count":1},{"id":"rec27JEBzpeJek","priority":"P0","status":"挂起","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李淑怡","description":"The app doesn't support Android from lowest version. The AI couldn't capture voi g（安静聆听）。这些对孩子来说更清楚，更容易用图标表现，也不会限制内容的使用时机。","source_count":1},{"id":"recvs9qMuHbTVo","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"按钮层级与优先级不匹配\n「Chat with Dino（和 Dino 聊天）」目前是最大、最居中、颜色最强烈的按钮 —— 但它不太可能是优先级最高的操作。与此同时，右下角的导航栏看起来包含了最重要的目的地，用的却是最小的按钮。\n建议： 先明确决定你希望孩子走哪条路径，然后让按钮的大小和颜色去反映这个层级。","source_count":1},{"id":"recvsbiuBKtr9b","priority":"P2","status":"挂起","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"探索板块 —— 缺少完成音效\n完成一个游戏时，老师看起来很兴奋，但没有配套的掌声音效。这个时刻显得很平淡。完成永远都应该有听得见的庆祝。","source_count":1},{"id":"recvsblaHGOfTC","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"把课程和听力馆连接起来\n课程中出现的歌曲和故事，应该在听力馆中被解锁。完成一节课应该看得见地为孩子的收藏增加一样东西 —— 这会带来令人愉悦的积累感，也让听力馆真正有了存在的意义。","source_count":1},{"id":"recvsblpi4u0Hq","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"未填","description":"给服装动画加上声音\n服装动画很吸引人，但是无声的。加上简单的配套音效 —— 比如踢足球的声音 —— 会让它们的满足感大大提升。","source_count":1},{"id":"recvsblDuOvpGG","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"未填","description":"购买前不要展示动画\n目前未购买的服装动画是完全可见的。这消除了购买的动力。建议： 购买前只显示静态图片，把动画留作购买后的奖励。另外也需要明确：除了外观之外，一套服装还有什么作用？是否有功能上的好处？","source_count":1},{"id":"recvsfClWjWs2O","priority":"P2","status":"排查中","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李双","description":"姓名识别困难，甚至超过5分钟","source_count":1},{"id":"recvsfClWjsLl4","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Listening Games部分音频不清晰","source_count":1},{"id":"recvsfClWjUcLV","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Word Battle出现题目重复","source_count":1},{"id":"recvsfClWjkCKZ","priority":"P0","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"需要听音频的题目没有播放声音","source_count":1},{"id":"recvsfClWjDbpO","priority":"P0","status": ,"source_count":1},{"id":"recvsfCoKStZBr","priority":"P2","status":"挂起","category":"用户账户与家庭体系","secondary":"家庭与学生档案","owner":"李双","description":"填写姓名和年龄时增加性别选择，并匹配相应头像","source_count":1},{"id":"recvsfP9jb5rep","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李双","description":"首次进入时没有语音欢迎\n第一次进入这个板块时，Dino 的开场白只以文字形式显示，没有音频，需要另外点一个按钮才能听到。这可能是个 bug。第二次进入时它立刻开口说话了，体验好得多。每一个新板块都应该以语音欢迎开场 —— 最好能叫出孩子的名字。","source_count":1},{"id":"recvsfPp5cXB4u","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"对小龄学习者来说过于开放\n聊天完全没有结构。出现了一个关于「聊聊太空」的提示，但一个低龄初学者根本不知道该怎么参与。应用在新手引导时已经收集了孩子的等级 —— 这个等级应该用来决定这个板块的内容。年龄小的孩子需要建议和支架式引导；年龄大的孩子需要适当的挑战。","source_count":1},{"id":"recvsfPxxETH4e","priority":"P1","status":"挂起","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"Dino Chat 需要一个目标\n其他板块都有进度指示 —— 游戏区显示「0/5」，非常有效地传达了目标。Dino Chat 没有对应的东西。如果希望孩子使用这个板块，就要给它一个清晰、可见的目标，让孩子知道「做完」是什么样子。","source_count":1},{"id":"recvsfPLdlyUAc","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"建议 —— 看图说话\n鼓励低龄学习者开口的一个成熟方法是描述图片。Dino 可以展示一张图片 —— 或者更好，一段有趣的短视频 —— 然后请孩子说出他看到的东西。这创造了自然的、低压力的开口机会。","source_count":1},{"id":"recvsfQ0PDsEgh","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"毕燕晨 Rosa","description":"Dino 的倾听姿势\n孩子说话时 Dino 把手放到耳边，这个细节非常棒。但他做这个动作时头部有一部分会消失 —— 值得修正。","source_count":1},{"id":"recvsyNR3h6U7O","priority":"P0","status":"排查中","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"目前只有 1 节免费的试听课，时长 12–18 分钟，如果孩子自己完成试听后就可以直接退出，用户的退出成本比较低，体验深度也比较有限，所以可能比较容易流失。可以考虑把免费体验增加到 3 节，让孩子和家长投入更多时间和精力，随着体验深度增加，用户的退出成本也会提高，形成一定的投入感和持续学习意愿，从而可能提升后续的转化率和留存。","source_count":1},{"id":"recvsyOx5ENqpi","priority":"P0","status":"待分析","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"未填","description":"第一次进入 App 时，整体操作流程比较复杂，而且前期引导全部是英文，家长和孩子不太容易理解每一步该怎么操作，也不太清楚如何正确选择","source_count":1} ority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"田园","description":"REVIEW(KR)：全局底部导航栏（Bottom Navigation Bar）激活态视觉聚焦不足——四个核心标签(Home/Explore/Words/FM)图标在未激活和激活态下视觉差异不够强烈，明亮蓝色/海浪底色上小图标容易被背景“吃掉”。建议强化Active State：图标变色+等比例放大15%~20%，或在图标下/后加微光浮雕光晕(Glow Indicator)，甚至激活时让Dino剪影动一下，让当前物理位置一目了然。","source_count":1},{"id":"O011","priority":"P2","status":"已解决","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"李双","description":"REVIEW(KR)：FM没有级别区分了吗？目前FM主要按使用场景分类(Goodnight Time/Morning Read/Anytime Audio)，没有按级别区分的入口，用户不易按英语水平选内容，建议FM增加级别标签或顶部筛选栏增加级别筛选。","source_count":1},{"id":"O012","priority":"P2","status":"已解决","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"李双","description":"REVIEW(KR)：FM磨耳朵模块，确保支持锁屏播放、后台悬浮窗播放，是否可添加锁屏播放按钮？","source_count":1},{"id":"O013","priority":"P2","status":"挂起","category":"本地化与市场适配","secondary":"文化宗教与市场偏好","owner":"田园","description":"详情：韩国团队明确指出用户更偏好迪士尼风格；后续AI老师3D/2D建模、icon细节及动态特效，建议整体向高质感、高亲和力的美式卡通风格对齐。","source_count":1},{"id":"O014","priority":"P2","status":"挂起","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"田园","description":"详情：结论“选老师UI DESIGN可以更可爱化一点”；目前选老师页面UI设计较为生硬，需进一步“可爱化”和插画化，增强儿童首次进入时的互动新鲜感。","source_count":1},{"id":"O015","priority":"P2","status":"进入需求池","category":"增长与转化","secondary":"注册激活与学习导流","owner":"李双","description":"详情：结论“进入class可以放地图/图片，现在这个比较像给家长看的”；Class首页应改变目前“信息流卡片”的严谨布局(太像给家长看的后台)，引入“关卡地图”或丰富插画大图作为核心视觉承载，让孩子有“探索通关”沉浸感。【明细表关联：课程列表卡片信息密度与主次简化】单卡承载信息量大(插画/标题/副标题/标签/Continue按钮)，横屏文字密集易产生视觉压迫，遵循“插画放大、文字缩减”原则扩大课程插画面积作为第一视觉锚点（CN：可调整）。","source_count":1},{"id":"O016","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"详情：结论“老师的衣服初始色都是白色，是否可在后期加入不一样的衣服，或用金币体系买衣服”。服装经济系统(生态闭环)解决初始服装全白单调，后期作为长线游戏化核心机制，联动V1.3.0金币体系，允许孩子用金币为老师购买/兑换衣服(皮肤体系)。","source_count":1},{"id":"O017","priority":"P2","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李双","description":"REVIEW(KR)：切换语言的展示逻辑是按首字母大小还是用户占比，是不是可以把韩语和阿语往上提一提。REVIEW(CN)：已解决。","source_count":1},{"id":"O018","priority":"P2","status":"挂起","category":"本地化与市场适配","secondary":"文化宗教与市场偏好","owner":"田园","description":"详情：结论“play模块：卡皮巴拉？”——play模块可考虑卡皮巴拉(Capybara)等本地化/萌系IP方向（待确认）。","source_count":1},{"id":"O019","priority":"P1","status":"已排期","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"李双","description":"fm听完，退出之后到了上级以及一级页面，fm的音频还在播放","source_count":1},{"id":"O020","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"李双","description":"左侧级别卡片，页面信息显示不全 （L3和L4)","source_count":1},{"id":"O021","priority":"P1","status":"已解决","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"没有best value最主推的方案，应该还是要突出一个主推套餐 凸显权益（可以结合看看商业化那边的反馈）","source_count":1},{"id":"O022","priority":"P2","status":"已解决","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"登入loading的时候有两个dino很奇怪（上面大的，下面小的），loading dino可以换一个形式","source_count":1},{"id":"O023","priority":"P1","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"价值宣传页，这一页对话文案没换，还是旧的","source_count":1},{"id":"O024","priority":"P2","status":"已排期","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"PK环节，开盲盒以及庆祝页面，没有任何音效","source_count":1},{"id":"O025","priority":"P0","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"【整合问题】\nDino在自由对话中会出现语法错误，并反复执着于某个话题或爱好（如oranges），影响对话自然度。\n\n【原始反馈】\n- [recvo0CXiv7kil] speaking里的dino对话问题调试，时常会有一些语法错误；以及dino一直很执着于说oranges\n- [recvpU0ykHKjiE] Dino在对话过程中会出现语法错误和执著于披露某个爱好的倾向","source_count":1},{"id":"O026","priority":"P0","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李淑怡","description":"【整合问题】\nDino在对话中存在多语言混说或语言使用不准确，例如英文回答中夹杂中文“九”，影响目标语言一致性。\n\n【原始反馈】\n- [recvo0CYMWJUdt] speaking里的dino存在中英混说的情况，例如问how old are you两次，dino都回复i‘m 9 (九）\n- [recvpU0OYVOrqp] 对话过程中Dino的多语言混说问题：speaking里的dino存在中英混说的情况，例如问how old are you两次，dino都回复i‘m 9 (九）\n- [recvpU1dZUahfI] 对话过程中的多语言使用不准确的问题","source_count":1},{"id":"O027","priority":"P1","status":"已排期","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"dino盲盒里面的题库建议集中梳理一次资源，例如题目的分级、有些不妥的题目删除等。目前测level2的时候题目难易度差距太大，有些题目过难（右侧国旗是否合规，已知国旗、地图等很容易不合规；帮妈妈做什么题每个选项感觉都对；图3明显对于l2太难了）","source_count":1},{"id":"O028","priority":"P2","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"学习计划价值宣传页： 1、标题上一个🌟遮挡住了文字 2、下面Level和unit展示板块目前UI看起来交互感强，用户看着想点选，但其实不可交互","source_count":1},{"id":"O029","priority":"P2","status":"已排期","category":"用户账户与家庭体系","secondary":"头像与主题个性化","owner":"李双","description":"【整合问题】\nProfile支持上传用户本地图片作为头像，并提供男孩/女孩、不同年龄形象、更多头像及主题个性化选项。\n\n【原始反馈】\n- [recvobjMztfS25] profile希望可以支持上传用户自己的本地图片作为头像。或者可以至少现有一个女孩的形象可供选择\n- [recvsfCoKSHZkM] 提供更多头像和主题个性化选项\n- [rec27JD4RZqXgZ] 建议用户的头像是可点击更改的\n- 男/女\n- 不同样子年纪（4岁和12岁样貌不一样），甚至可以给与多款选择增强体验感\n- [rec27PvMaVKKKV] I think the app need to have the gender: male, female so that the avatar will be show a girl or a boy and they able to upload their picture at well\n- [recvsfCoKS7SVB] 学生头像选择少，而且只显示男孩","source_count":1},{"id":"O030","priority":"P0","status":"已解决","category":"增长与转化","secondary":"注册激活与学习导流","owner":"李双","description":"上课提示或指引不够明显，很多用户初次打开并不知道要去上体验课，而是在跟Dino不断对话。","source_count":1},{"id":"O031","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"角色命名与性别适配","owner":"李双、毕燕晨 Rosa","description":"【整合问题】\n女性角色或女性AI老师使用“Max”等偏男性化名字，角色性别与命名不一致。\n\n【原始反馈】\n- [rec27JCQNnjwvb] 为什么女生的角色是男生的名字？\n- [recvsfCoKS6VdD] 女性老师使用“Max”这一偏男性化名字，角色设定不一致","source_count":1},{"id":"O032","priority":"P2","status":"已解决","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"Android 点击 back按钮直接出退APP，建议弹出确认，或者关闭back按钮功能。","source_count":1},{"id":"O033","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李淑怡、毕燕晨 Rosa","description":"【整合问题】\nASR语音识别不够稳定或灵敏，可能需要重复多次；已出现将“weekend”错误识别为“we can”的案例。\n\n【原始反馈】\n- [rec27JCWF00jl3] The interface seems smooth and looks very nice.\nThe lessons are interactive and engaging.\nSometimes happened where the voice recognition didn't capture the words, need to repeat few times. But not often\nI share screen shot where I said \"weekend\" but it capture \"we can\"\n- [recvpU0ThbzVBB] ASR识别不够灵敏：把weekend识别成we can","source_count":1},{"id":"O034","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双、李淑怡、毕燕晨 Rosa","description":"【整合问题】\n点击AI老师或Dino时缺少多样化互动反馈；应增加招手、舞蹈、趣味回复等主动或点击反应，提升角色活跃度。\n\n【原始反馈】\n- [rec27JD9rbnOPz] 当用户随手点击左边的卡通老师时，老师可有几个简单的互动和回复，比如\n- 招手说 hi, are you ready to learn?\n- 调皮被戳到的反应笑着说一些简单的回复（轻松有趣的回复）\n\n整体是为了增强体验感，当用户随手点击并得到反馈时，用户会更有兴趣探索。尽可能可以点击的地方都有得到简单的反馈会更棒\n- [rec27JDcmjULJW] 当用户点击Dino时，Dino可有不同的反应回馈，增强乐趣和互动。即使用户没有点击Dino，Dino也可以时不时有个小反应（招手，小舞蹈，可爱小动作）让Dino更活跃，而不是像个robot等待用户说话才给反应。","source_count":1},{"id":"O035","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"本地账号与语言适配","owner":"李淑怡","description":"Sometimes, translations from one language to another are not accurate.","source_count":1},{"id":"O036","priority":"P0","status":"挂起","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李淑怡","description":"The app doesn't support Android from lowest version. The AI couldn't capture voice recognition frequently.","source_count":1},{"id":"O037","priority":"P0","status":"挂起","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"未填","description":"The content is not clear","source_count":1},{"id":"O038","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"未填","description":"The AI provides positive feedback such as \"Good job\" even when the student's answer is incorrect.","source_count":1},{"id":"O039","priority":"P0++","status":"已解决","category":"支付与订阅商业化","secondary":"支付订单与售后","owner":"未填","description":"Unable to make payment through google play store","source_count":1},{"id":"O040","priority":"P0++","status":"已解决","category":"支付与订阅商业化","secondary":"支付订单与售后","owner":"未填","description":"Customer facing issue when trying to login with OTP for payment page. Need several attempt to get the correct code. \nCode via WhatsApp was wrong. \nCode via SMS is correct.","source_count":1},{"id":"O041","priority":"P0","status":"已解决","category":"增长与转化","secondary":"注册激活与学习导流","owner":"未填","description":"\"when i click the google icon. It hang here\"\n The customer has done it multiple times but keeps hanging. Device is Android.","source_count":1},{"id":"O042","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"未填","description":"探索板块 —— 图片太小\n在「房间名称」游戏中，图片小到看不清楚。页面上有大量留白，把图片做大。","source_count":1},{"id":"O043","priority":"P0","status":"进入需求池","category":"课后业务闭环","secondary":"未填","owner":"孔丽莉","description":"题目应该基于教过的内容\n游戏题目看起来和课程内容脱节。建议： 建立一个题库，题目内容全部来自孩子实际接触过的语言，题型也要和他们学过的形式匹配。","source_count":1},{"id":"O044","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"分区标签需要重新思考\n目前的标签 —— 「Anytime Audio（随时听）」、「Good Night Time（晚安时间）」、「Morning Read（晨读）」—— 含义不清，而且没必要地把内容和一天中的时间段绑定在一起。\n建议改为按内容类型而非时间来划分： Story Time（故事时间）、Song Box（歌曲盒）、Bedtime Stories（睡前故事）、Quiet Listening（安静聆听）。这些对孩子来说更清楚，更容易用图标表现，也不会限制内容的使用时机。","source_count":1},{"id":"O045","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"按钮层级与优先级不匹配\n「Chat with Dino（和 Dino 聊天）」目前是最大、最居中、颜色最强烈的按钮 —— 但它不太可能是优先级最高的操作。与此同时，右下角的导航栏看起来包含了最重要的目的地，用的却是最小的按钮。\n建议： 先明确决定你希望孩子走哪条路径，然后让按钮的大小和颜色去反映这个层级。","source_count":1},{"id":"O046","priority":"P2","status":"挂起","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"李双","description":"探索板块 —— 缺少完成音效\n完成一个游戏时，老师看起来很兴奋，但没有配套的掌声音效。这个时刻显得很平淡。完成永远都应该有听得见的庆祝。","source_count":1},{"id":"O047","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"内容导航与媒体体验","owner":"未填","description":"把课程和听力馆连接起来\n课程中出现的歌曲和故事，应该在听力馆中被解锁。完成一节课应该看得见地为孩子的收藏增加一样东西 —— 这会带来令人愉悦的积累感，也让听力馆真正有了存在的意义。","source_count":1},{"id":"O048","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"未填","description":"给服装动画加上声音\n服装动画很吸引人，但是无声的。加上简单的配套音效 —— 比如踢足球的声音 —— 会让它们的满足感大大提升。","source_count":1},{"id":"O049","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"未填","description":"购买前不要展示动画\n目前未购买的服装动画是完全可见的。这消除了购买的动力。建议： 购买前只显示静态图片，把动画留作购买后的奖励。另外也需要明确：除了外观之外，一套服装还有什么作用？是否有功能上的好处？","source_count":1},{"id":"O050","priority":"P2","status":"排查中","category":"课外学习与互动体验","secondary":"语音识别与口语交互","owner":"李双","description":"姓名识别困难，甚至超过5分钟","source_count":1},{"id":"O051","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Listening Games部分音频不清晰","source_count":1},{"id":"O052","priority":"P1","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"Word Battle出现题目重复","source_count":1},{"id":"O053","priority":"P0","status":"排查中","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"需要听音频的题目没有播放声音","source_count":1},{"id":"O054","priority":"P0","status":"排查中","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"Speaking进行到第三阶段后卡住，最终显示0分","source_count":1},{"id":"O055","priority":"P0","status":"排查中","category":"稳定性与平台兼容","secondary":"平台兼容、资源性能与流程稳定","owner":"李双","description":"图片或视频加载较慢","source_count":1},{"id":"O056","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李双","description":"盲盒答错后无法查看错题、正确答案和解释","source_count":1},{"id":"O057","priority":"P1","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"【整合问题】\n试用期间每个功能只能体验一次，且不能重复练习，导致用户无法充分体验产品能力。\n\n【原始反馈】\n- [recvsfCnEX2m4V] 每个功能只能体验一次\n- [recvsfCnEXoAo7] 试用期间不能重复练习","source_count":1},{"id":"O058","priority":"P1","status":"已解决","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"试用期间不能尝试不同课程或等级","source_count":1},{"id":"O059","priority":"P0","status":"排查中","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"体验出现故障后，没有第二次验证机会","source_count":1},{"id":"O060","priority":"P1","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"在当前试用限制下，价格会显得偏高","source_count":1},{"id":"O061","priority":"P0","status":"排查中","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"【整合问题】\n学习计划显示“每周三节课”，用户无法判断这是推荐学习频率还是订阅后的使用上限。\n\n【原始反馈】\n- [recvsfCnEXJwwH] 学习计划显示“每周三节课”，用户无法判断订阅后是否每周只能上三节课\n- [recvsfCnEXBhcr] 用户无法判断“三节课”是推荐学习频率还是使用上限","source_count":1},{"id":"O062","priority":"P0","status":"挂起","category":"支付与订阅商业化","secondary":"套餐定价与订阅权益","owner":"李双","description":"【整合问题】\n用户无法判断不同订阅套餐包含的权益、可用内容量，以及AI对话、游戏和练习是否可以无限使用。\n\n【原始反馈】\n- [recvsfCoKSkpIW] 用户无法判断AI对话、游戏和练习是否可以无限使用\n- [recvsfCoKSrzME] 用户无法判断不同订阅套餐分别包含什么权益\n- [recvsfCoKSadHT] 用户不知道支付后究竟能获得多少内容","source_count":1},{"id":"O063","priority":"P1","status":"进入需求池","category":"本地化与市场适配","secondary":"文化宗教与市场偏好","owner":"李双","description":"建议增加戴Hijab、穿沙特服装的女性老师","source_count":1},{"id":"O064","priority":"P2","status":"挂起","category":"用户账户与家庭体系","secondary":"家庭与学生档案","owner":"李双","description":"填写姓名和年龄时增加性别选择，并匹配相应头像","source_count":1},{"id":"O065","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李双","description":"首次进入时没有语音欢迎\n第一次进入这个板块时，Dino 的开场白只以文字形式显示，没有音频，需要另外点一个按钮才能听到。这可能是个 bug。第二次进入时它立刻开口说话了，体验好得多。每一个新板块都应该以语音欢迎开场 —— 最好能叫出孩子的名字。","source_count":1},{"id":"O066","priority":"P1","status":"进入需求池","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"对小龄学习者来说过于开放\n聊天完全没有结构。出现了一个关于「聊聊太空」的提示，但一个低龄初学者根本不知道该怎么参与。应用在新手引导时已经收集了孩子的等级 —— 这个等级应该用来决定这个板块的内容。年龄小的孩子需要建议和支架式引导；年龄大的孩子需要适当的挑战。","source_count":1},{"id":"O067","priority":"P1","status":"挂起","category":"课外学习与互动体验","secondary":"AI对话与学习反馈","owner":"李淑怡","description":"Dino Chat 需要一个目标\n其他板块都有进度指示 —— 游戏区显示「0/5」，非常有效地传达了目标。Dino Chat 没有对应的东西。如果希望孩子使用这个板块，就要给它一个清晰、可见的目标，让孩子知道「做完」是什么样子。","source_count":1},{"id":"O068","priority":"P2","status":"进入需求池","category":"课外学习与互动体验","secondary":"课外内容与课程报告","owner":"李双","description":"建议 —— 看图说话\n鼓励低龄学习者开口的一个成熟方法是描述图片。Dino 可以展示一张图片 —— 或者更好，一段有趣的短视频 —— 然后请孩子说出他看到的东西。这创造了自然的、低压力的开口机会。","source_count":1},{"id":"O069","priority":"P1","status":"已解决","category":"课外学习与互动体验","secondary":"角色互动与游戏化反馈","owner":"毕燕晨 Rosa","description":"Dino 的倾听姿势\n孩子说话时 Dino 把手放到耳边，这个细节非常棒。但他做这个动作时头部有一部分会消失 —— 值得修正。","source_count":1},{"id":"O070","priority":"P0","status":"排查中","category":"增长与转化","secondary":"试用策略与转化引导","owner":"李双","description":"目前只有 1 节免费的试听课，时长 12–18 分钟，如果孩子自己完成试听后就可以直接退出，用户的退出成本比较低，体验深度也比较有限，所以可能比较容易流失。可以考虑把免费体验增加到 3 节，让孩子和家长投入更多时间和精力，随着体验深度增加，用户的退出成本也会提高，形成一定的投入感和持续学习意愿，从而可能提升后续的转化率和留存。","source_count":1},{"id":"O071","priority":"P0","status":"待分析","category":"UI/UX与练习体验 UX","secondary":"操作指令不清晰","owner":"未填","description":"第一次进入 App 时，整体操作流程比较复杂，而且前期引导全部是英文，家长和孩子不太容易理解每一步该怎么操作，也不太清楚如何正确选择","source_count":1}]},"classifications":{"课中分类体系":[{"category":"内容课程 Content","description":"教学用逐字稿、题目、素材、目标与模板等课程内容本身的正确性与设计匹配问题。","total":189,"secondaries":[{"name":"素材缺失/错误","count":112,"description":"图片、音频、视频、动画、卡片等教学素材缺失、错配或内容错误。"},{"name":"教学节奏/模板设计","count":40,"description":"模板、热区、环节设计本身导致难用或不流畅。"},{"name":"逐字稿错误/不恰当","count":17,"description":"老师应播逐字稿存在文本、语法、发音标注、顺序或内容错误。"},{"name":"课件与教学行为不一致","count":7,"description":"AI 老师提问、页面展示、题目或互动对象不一致。"},{"name":"教学目标与活动不匹配","count":7,"description":"内容、练习或反馈与当前课程目标、难度、年龄段或学习阶段不匹配。"},{"name":"题目/答案/知识点配置错误","count":5,"description":"题目、选项、正确答案、判题规则或互动配置错误。"},{"name":"优化点","count":1,"description":"Excel《分类治理（一级&二级）》未提供该二级分类的具体定义。"}]},{"category":"UI/UX与练习体验 UX","description":"学生在页面操作、练习互动、反馈提示、奖励机制和游戏化体验中的可理解性与顺畅度问题。","total":133,"secondaries":[{"name":"练习交互不顺畅","count":52,"description":"练习中的操作路径、等待、节奏或互动机制影响学生完成任务。"},{"name":"操作指令不清晰","count":27,"description":"页面或老师给出的操作说明让学生不知道该做什么或怎么做。"},{"name":"金币/奖励异常","count":13,"description":"金币、星星、积分、徽章等奖励展示、发放或规则异常。"},{"name":"优化点","count":11,"description":"Excel《分类治理（一级&二级）》未提供该二级分类的具体定义。"},{"name":"按 function bindSectionObserver(){
  sectionObserver?.disconnect();
  sectionObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(visible){
      const id=visible.target.id.replace("section-","");
      if(id!==activeSection){activeSection=id;renderSectionTabs()}
    }
  },{rootMargin:"-125px 0px -62% 0px",threshold:[0,.1,.3]});
  SECTION_ORDER.forEach(([id])=>{const el=document.getElementById(`section-${id}`);if(el)sectionObserver.observe(el)});
}

}

function table(headers,rows,alignFrom=1,alignment="right"){
  const alignClass=i=>i>=alignFrom?alignment:"";
  return `<div class="wide"><table><thead><tr>${headers.map((h,i)=>`<th class="${alignClass(i)}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${alignClass(i)}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function priorityDetailTables(scopeKey){
  const details=DATA.priorityDetails[scopeKey]||[];
  return ["P0++","P0","P1","P2","未填"].map(priority=>{
    const items=details.filter(item=>item.priority===priority);
    if(!items.length)return "";
    const rows=items.map(item=>[
      esc(item.id),item.source_count,esc(item.status),esc(item.category),esc(item.secondary),
      esc(item.owner),esc(item.description)
    ]);
    return `<details class="detail-group"><summary>${esc(scopeKey)} · ${priority} 反馈问题明细（${items.length}）</summary>${table(["问题ID","合并条数","进展","一级分类","二级分类","负责人","问题描述"],rows,99)}</details>`;
  }).join("");
}
function unresolvedByCategoryTables(scopeKey){
  const details=(DATA.priorityDetails[scopeKey]||[]).filter(item=>item.status!=="已解决");
  const priRank=p=>["P0++","P0","P1","P2","未填"].indexOf(p);
  const groups=new Map();
  for(const item of details){
    const cat=item.category||"(未填一级)";
    if(!groups.has(cat))groups.set(cat,[]);
    groups.get(cat).push(item);
  }
  const ordered=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"zh"));
  if(!ordered.length)return "";
  const blocks=ordered.map(([category,rows])=>{
    const sorted=[...rows].sort((a,b)=>{
      const pa=priRank(a.priority),pb=priRank(b.priority);
      return (pa<0?99:pa)-(pb<0?99:pb)||String(a.secondary).localeCompare(String(b.secondary),"zh")||String(a.id).localeCompare(String(b.id));
    });
    const high=sorted.filter(r=>r.priority==="P0++"||r.priority==="P0").length;
    const tableRows=sorted.map(item=>[
      esc(item.priority),esc(item.secondary),esc(item.owner),item.source_count,
      esc(String(item.description||"").replace(/\s+/g," ").trim()),esc(item.status)
    ]);
    return `<details class="detail-group"><summary>${esc(category)} · 未解决 ${sorted.length}（高优 ${high}）</summary>${table(["优先级","二级分类","负责人","合并","问题描述","进展"],tableRows,99)}</details>`;
  }).join("");
  return `<div class="section-sub" style="margin-top:14px">${esc(scopeKey)} · 未解决明细按一级分类（共 ${details.length} 条）</div>${blocks}`;
}

    <div class="card" style="margin-top:12px"><div class="card-title">优先级口径说明</div><div class="priority-guide"><div><div class="guide-label">P0++（阻断）</div><div class="guide-text">课堂无法推进、流程卡死、大面积不可用，或核心业务被直接阻断。</div></div><div><div class="guide-label">P0（高优）</div><div class="guide-text">显著影响注册、完课、支付转化，或体验课学习效果与关键学习体验。</div></div><div><div class="guide-label">P1</div><div class="guide-text">体验明显受损但仍可完成主流程，需纳入近期迭代。</div></div><div><div class="guide-label">P2</div><div class="guide-text">不阻断主流程的体验优化项，可按版本节奏排期。</div></div></div></div>`;
  document.getElementById("dashboard").innerHTML=`
    <section class="section" id="section-overall"><div class="section-title"><h2>整体情况</h2></div>
      ${priorityOverviewHtml}
        <div class="analysis" style="margin-top:14px"><strong>阶段修复成效与剩余需求结构</strong>${achievementHtml}</div>
    </section>
    <section class="section" id="section-landscape"><div class="section-title"><h2>问题分类全景</h2></div>
      <div class="grid grid-2" style="margin-top:14px"><div class="card"><div class="card-title">${scope} · 各一级分类反馈量</div>${bars(d.by_category)}</div><div class="card"><div class="card-title">${scope} · 优先级结构</div>${donut(d.overall_priority,d.total_valid)}</div></div>
      <div class="grid grid-even" style="margin-top:14px"><div class="card"><div class="card-title">${scope} · 反馈渠道占比</div>${donut(d.channel_distribution,d.channel_total)}</div><div class="card"><div class="card-title">每周新增反馈 / 解决问题数量 · 6/28–9/17</div>${weeklyChart(d.weekly)}<div class="muted" style="font-size:11px;margin-top:6px">区间合计：新增 ${d.weekly.created_total} · 解决 ${d.weekly.resolved_total}</div><div class="muted" style="font-size:11px;line-height:1.6;margin-top:5px">数据说明：7 月集中解决的问题未完整补录创建时间和解决时间，相关字段存在缺失；反馈问题通常会批量导入，日常发现的阻塞性问题会优先修复，也可能未同步录入。因此折线仅反映已填写时间字段的记录，不代表实际新增与解决总量。</div></div></div>
      <div style="margin-top:14px">${table(["一级分类","条数","占比","高优占比","已解决率","未解决"],categoryRows)}</div>
    </section>
    <section class="section" id="section-resolution"><div class="section-title"><h2>各类问题解决情况</h2></div>
      <div class="status-grid"><div class="card"><div class="card-title">${scope} · 进展状态占比</div>${donut(d.overall_status,d.total_valid)}</div><div>${table(["一级分类","总量","已解决","解决率","处理中","需求池","待分析","未解决"],resolutionRows)}</div></div>
      <div class="${hasSpecial?"grid grid-even":"grid"}" style="margin-top:14px">${specialResolutionCard}<div class="card"><div class="card-title">${scope} · 二级分类未解决 Top 12</div>${table(["一级分类","二级分类","未解决","高优","专项","关联专项"],secondaryRows,2)}</div></div>
    </section>
    <section class="section" id="section-actions"><div class="section-title"><h2>如何解决</h2></div><div class="analysis" style="margin-bottom:14px"><b>专项与非专项采用双轨治理：</b>专项问题 ${d.special_unresolved} 条按专项里程碑推进，其中TTS / ASR badcase进入模型训练、回归评测与持续验证；系统稳定性问题按入课、加载、播放、状态机、弱网与崩溃根因专项修复；非专项问题 ${d.non_special_unresolved} 条按版本明确Owner、目标时间和验收标准。</div>${table(["一级分类","未解决","专项未解决","高优问题个数","主责方","处理路径（每一类处理路径重点均为：数据验证）"],actionRows,1,"center")}${specialActionCard}</section>
    <section class="section" id="section-appendix"><div class="section-title"><h2>附录</h2></div>${priorityDetailTables(scope)}${unresolvedByCategoryTables(scope)}<div class="section-sub" style="margin-top:14px">${scope} · 各一级分类优先级与进展分布</div>${table(["一级分类","总量","优先级分布","进展分布"],appendixRows,1)}</section>`;
  document.getElementById("footer").textContent=`数据：Lark「反馈跟踪记录」完整底表 ${DATA.total} 条 · 当前 ${scope} · 总量 ${d.total_valid} · 已解决 ${d.resolved} · 待分析 ${d.empty_status}`;
}
document.getElementById("updatedAt").textContent=DATA.updatedAt;
document.getElementById("totalRecords").textContent=DATA.total;
renderTaxonomy();renderTabs();renderSectionTabs();renderDashboard();bindSectionObserver();
</script>
</body>
</html>
